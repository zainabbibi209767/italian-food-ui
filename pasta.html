<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasta Perfetto | Authentic Italian</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100vh; overflow: hidden; font-family: 'Montserrat', sans-serif; background: #faf9f6; }

        .pasta-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Background: Rustic Wooden Table with Ingredients */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1498579150354-97251ceb820e?q=80&w=2070') no-repeat center center/cover;
            padding: 20px;
        }

        .main-card {
            width: 95%;
            max-width: 1100px;
            height: 80vh;
            background: #fff;
            border-radius: 40px;
            display: flex;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid #eee;
        }

        /* Left Side: Visual Image */
        .visual-panel {
            flex: 1.1;
            position: relative;
            overflow: hidden;
        }

        .pasta-img {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1473093226795-af9932fe5856?q=80&w=1994') no-repeat center center/cover;
            transition: transform 1.5s ease;
        }

        .main-card:hover .pasta-img {
            transform: scale(1.1);
        }

        /* Right Side: Editorial Content */
        .info-panel {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }

        .chef-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #2d5a27; /* Basil Green */
            font-weight: 700;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Lobster', cursive;
            font-size: 5rem;
            color: #a04000; /* Terracotta Red */
            line-height: 1;
            margin-bottom: 25px;
        }

        p {
            color: #555;
            line-height: 1.8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .taste-btn {
            padding: 18px 45px;
            background: #2d5a27;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
            width: fit-content;
            box-shadow: 0 10px 20px rgba(45, 90, 39, 0.2);
        }

        .taste-btn:hover {
            background: #a04000;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(160, 64, 0, 0.3);
        }

        /* Floating Badge */
        .badge {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 25px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #a04000;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="pasta-wrapper">
        <div class="main-card">
            <!-- Visual Section -->
            <div class="visual-panel">
                <div class="pasta-img"></div>
                <div class="badge">🍝 Handcrafted Daily</div>
            </div>

            <!-- Content Section -->
            <div class="info-panel">
                <span class="chef-tag">Authentic Recipes</span>
                <h1>Simply <br>Divine.</h1>
                <p>Taste the tradition of Italy. From silky carbonara to rich bolognese, our pastas are made with imported semolina and a whole lot of passion.</p>
                
                <a href="#" class="taste-btn">Explore Flavors</a>
            </div>
        </div>
    </div>

</body>
</html>
